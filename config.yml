baseURL: "https://cesarchavezp29.github.io/"
title: Carlos César Chávez Padilla
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

outputs:
    home:
        - HTML
        - RSS
        - JSON

menu:
    main:
        - name: Research
          url: papers/
          weight: 2
        - name: CV
          url: cv/
          weight: 3
        - name: Talks
          url: talks/
          weight: 4
        - name: Teaching
          url: teaching/
          weight: 5
        - name: Projects
          url: projects/
          weight: 6
        - name: Data
          url: data/
          weight: 7
        - name: Search
          url: search/
          weight: 8

params:
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        threshold: 0.4
        minMatchCharLength: 2
        keys: ["title", "permalink", "summary", "content"]
    description: "Carlos César Chávez Padilla is a Development Economist at the University of Chicago, Center for the Economics of Human Development. Research on development economics, political economy, human capital, and Latin America, with a focus on Peru."
    author: Carlos César Chávez Padilla

    # --- Canonical identity. Used by schema.org JSON-LD, Open Graph and author meta.
    # Change it here and nowhere else.
    identity:
        name: "Carlos César Chávez Padilla"
        givenName: "Carlos César"
        familyName: "Chávez Padilla"
        alternateName: ["Carlos Chávez", "Carlos Chavez", "Carlos C. Chávez Padilla"]
        jobTitle: "Development Economist"
        affiliation: "University of Chicago"
        affiliationURL: "https://www.uchicago.edu/"
        affiliationUnit: "Center for the Economics of Human Development"
        affiliationUnitURL: "https://cehd.uchicago.edu/"
        # Past institutions. Declared as alumniOf so no crawler reads them as a current affiliation.
        alumniOf:
            - name: "University of Chicago, Harris School of Public Policy"
              url: "https://harris.uchicago.edu/"
            - name: "Universidad Nacional Mayor de San Marcos"
              url: "https://unmsm.edu.pe/"
        knowsAbout:
            - "Development economics"
            - "Political economy"
            - "Human capital and skill formation"
            - "Applied econometrics"
            - "Latin America"
            - "Peru"

    # --- Identity links emitted as schema.org sameAs. Only verified URLs belong here:
    # a wrong profile URL is a worse signal than a missing one.
    schema:
        publisherType: Person
        sameAs:
            - "https://scholar.google.com/citations?user=LsVe9yQAAAAJ&hl=en"
            - "https://github.com/cesarchavezp29"
            - "https://carloschavezp29.substack.com"
            - "https://orcid.org/0000-0002-5885-7723"
            - "https://www.linkedin.com/in/cchavezpadilla/"
            # RePEc pch1721, not pch806: that is a different Carlos Chavez
            # (Universidad de Talca) and RePEc itself flags the confusion.
            # This profile is stale - it still lists UNMSM and the old Google Site.
            - "https://ideas.repec.org/f/pch1721.html"
            # SSRN author 3072371, verified: "Author Page for Carlos Chavez Padilla",
            # 26 papers. Like RePEc, this profile still lists UNMSM alongside UChicago.
            - "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=3072371"
    images:
        - og-image.png
    ogImageWidth: 1200
    ogImageHeight: 630
    ogImageAlt: "Carlos César Chávez Padilla — Development Economist, University of Chicago"
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","projects","data"]
    ShowToc: false
    disableScrollToTop: false
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Carlos César Chávez Padilla
          subtitle: "I am a Research Professional at the Center for the Economics of Human Development at the University of Chicago, where I collaborate with Prof. James J. Heckman on early childhood skill formation. I hold an MA in Public Policy from the Harris School of Public Policy. My research focuses on development economics, political economy, and Latin America, particularly Peru."
          tagline: "Development Economist · University of Chicago"
          imageUrl: "picture.jpeg"
          imageWidth: 200
          imageHeight: 200
          buttons:
            - name: Research
              url: papers/
            - name: Projects
              url: projects/
            - name: Data
              url: data/
            - name: Tags
              url: tags/
            - name: Archive
              url: archive/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:cesarchavezpadilla@gmail.com
        - name: Location
          url: location/
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=LsVe9yQAAAAJ&hl=en
        - name: GitHub
          url: https://github.com/cesarchavezp29

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Carlos César Chávez Padilla"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2