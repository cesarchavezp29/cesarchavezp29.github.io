# Independent selection, discussion, translation and teaching use of the research and
# essays. One entry, one place: the homepage section and the individual paper pages both
# read from this file.
#
# Fields
#   kind         research | writing | teaching | policy   (groups the homepage section)
#   source       the outlet or institution, as it names itself
#   description  what actually happened, stated plainly. Not promotional copy.
#   work         the piece that was selected or discussed
#   workURL      where that piece lives (Substack for the essays, this site for papers)
#   date         ISO, for sorting
#   dateDisplay  what is shown, at the precision actually known
#   url          direct link to the item itself. Left empty when not yet confirmed;
#                the entry then renders without a link rather than with a guessed one.
#   papers       slugs under content/papers/ that this attaches to, so the paper page
#                can render its own recognition. Empty for the Substack essays, which
#                have no page on this site.

